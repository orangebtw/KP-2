<!DOCTYPE html>
<html lang="ru" class="w-full h-full">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link href="static/css/style.css" rel="stylesheet">
  </head>
  <body class="bg-slate-900 w-full h-full">
    <div id="main_container" class="flex flex-col h-full justify-center space-y-18">
      <div id="header" class="flex flex-col items-center space-y-4 mt-14">
        <h1 class="text-6xl text-neutral-200">Компьютерный практикум</h1>
        <h2 class="text-4xl text-neutral-300">Лабораторная работа 4</h2>
      </div>
      <div id="main_content" class="flex flex-col grow items-center">
        <div id="card" class="flex bg-slate-800 w-250 px-8 py-10 rounded-md outline outline-white/15 shadow-lg justify-center align-center">
          <form action="/size2json" method="POST" enctype="multipart/form-data" class="flex flex-col space-y-6 w-full">
            <div class="relative mt-2 rounded-lg">
              <div id="image_drop_zone_bg" class="absolute w-full h-full bg-contain bg-center bg-no-repeat"></div>
              <div id="image_drop_zone" class="relative bg-black/40 flex rounded-lg justify-center border border-dashed border-white/25 px-24 py-12">
                <div class="text-center">
                  <svg viewBox="0 0 24 24" fill="currentColor" data-slot="icon" aria-hidden="true" class="mx-auto size-12 text-gray-600">
                    <path d="M1.5 6a2.25 2.25 0 0 1 2.25-2.25h16.5A2.25 2.25 0 0 1 22.5 6v12a2.25 2.25 0 0 1-2.25 2.25H3.75A2.25 2.25 0 0 1 1.5 18V6ZM3 16.06V18c0 .414.336.75.75.75h16.5A.75.75 0 0 0 21 18v-1.94l-2.69-2.689a1.5 1.5 0 0 0-2.12 0l-.88.879.97.97a.75.75 0 1 1-1.06 1.06l-5.16-5.159a1.5 1.5 0 0 0-2.12 0L3 16.061Zm10.125-7.81a1.125 1.125 0 1 1 2.25 0 1.125 1.125 0 0 1-2.25 0Z" clip-rule="evenodd" fill-rule="evenodd" />
                  </svg>
                  <div class="mt-4 flex text-sm/6 text-gray-400">
                    <label for="image" class="relative cursor-pointer rounded-md bg-transparent font-semibold text-indigo-400 focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-indigo-500 hover:text-indigo-300">
                      <span>Загрузите файл</span>
                      <input id="image" type="file" name="image" class="sr-only" />
                    </label>
                    <p class="pl-1">или перетащите его сюда</p>
                  </div>
                  <p class="text-xs/5 text-gray-400">PNG</p>
                </div>
              </div>
            </div>
            <div>
              <button type="submit" class="flex w-full justify-center rounded-md bg-indigo-500 px-3 py-1.5 text-sm/6 font-semibold text-white hover:bg-indigo-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500">Отправить</button>
            </div>
          </form>
        </div> 
      </div>
      <div id="footer" class="mx-10 mb-10">
        <span class="text-lg text-gray-400">Сделал:</span>
        <span class="text-lg text-blue-400">Карпов Роман, ИВТ-2</span> 
      </div>
    </div>

    <script src="/static/js/index.js"></script>
  </body>
</html>
